  <!-- Stats Cards Row -->
  <rect x="204" y="68" width="180" height="74" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-opacity="0.6"/>
  <text x="220" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Total Active Orders</text>
  <text x="220" y="116" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="700">148</text>
  <rect x="330" y="98" width="42" height="18" rx="4" fill="#10B981" fill-opacity="0.15"/>
  <text x="336" y="111" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">+18%</text>

  <rect x="398" y="68" width="180" height="74" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-opacity="0.6"/>
  <text x="414" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Inventory Units</text>
  <text x="414" y="116" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="700">1,240</text>
  <rect x="524" y="98" width="44" height="18" rx="4" fill="#3B82F6" fill-opacity="0.15"/>
  <text x="532" y="111" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Synced</text>

  <rect x="592" y="68" width="186" height="74" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-opacity="0.6"/>
  <text x="608" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">System Status</text>
  <text x="608" y="116" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Operational</text>
  <circle cx="754" cy="105" r="5" fill="#10B981"/>

