<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bg)"/>
  <rect width="800" height="480" rx="16" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#0F172A" fill-opacity="0.9"/>
  <circle cx="28" cy="24" r="5" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="44" cy="24" r="5" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="60" cy="24" r="5" fill="#10B981" fill-opacity="0.8"/>
  
  <rect x="220" y="12" width="360" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="320" y="28" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">vendly-lk.vercel.app/dashboard</text>
  <circle cx="236" cy="24" r="3" fill="#10B981"/>

  <!-- Sidebar -->
  <rect x="0" y="48" width="180" height="432" fill="#0F172A" fill-opacity="0.6"/>
  <line x1="180" y1="48" x2="180" y2="480" stroke="#334155" stroke-opacity="0.4"/>
  
  <!-- Logo -->
  <rect x="20" y="68" width="28" height="28" rx="8" fill="url(#blueGrad)"/>
  <text x="30" y="87" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">V</text>
  <text x="56" y="86" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Vendly<tspan fill="#38BDF8">.lk</tspan></text>

  <!-- Sidebar Nav items -->
  <rect x="16" y="116" width="148" height="34" rx="8" fill="#1E293B" fill-opacity="0.9"/>
  <rect x="24" y="124" width="16" height="16" rx="4" fill="#3B82F6"/>
  <text x="48" y="137" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Dashboard</text>

  <text x="48" y="174" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Orders &amp; Sales</text>
  <circle cx="32" cy="170" r="4" fill="#64748B"/>

  <text x="48" y="210" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Inventory</text>
  <circle cx="32" cy="206" r="4" fill="#64748B"/>

  <text x="48" y="246" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Customers</text>
  <circle cx="32" cy="242" r="4" fill="#64748B"/>

  <text x="48" y="282" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Analytics</text>
  <circle cx="32" cy="278" r="4" fill="#64748B"/>

  <text x="48" y="318" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Settings</text>
