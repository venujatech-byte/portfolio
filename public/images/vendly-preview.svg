  <rect x="604" y="196" width="162" height="48" rx="6" fill="#1E293B" stroke="#334155" stroke-opacity="0.4"/>
  <text x="614" y="214" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">#ORD-9421</text>
  <text x="614" y="230" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Express Delivery</text>
  <rect x="710" y="206" width="48" height="16" rx="4" fill="#10B981" fill-opacity="0.2"/>
  <text x="716" y="218" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Shipped</text>

  <!-- Order item 2 -->
  <rect x="604" y="250" width="162" height="48" rx="6" fill="#1E293B" stroke="#334155" stroke-opacity="0.4"/>
  <text x="614" y="268" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">#ORD-9420</text>
  <text x="614" y="284" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Standard Shipping</text>
  <rect x="712" y="260" width="46" height="16" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="718" y="272" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Pending</text>

  <!-- Order item 3 -->
  <rect x="604" y="304" width="162" height="48" rx="6" fill="#1E293B" stroke="#334155" stroke-opacity="0.4"/>
  <text x="614" y="322" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">#ORD-9419</text>
  <text x="614" y="338" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Direct Pickup</text>
  <rect x="710" y="314" width="48" height="16" rx="4" fill="#10B981" fill-opacity="0.2"/>
  <text x="716" y="326" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Shipped</text>

  <!-- Order item 4 -->
  <rect x="604" y="358" width="162" height="48" rx="6" fill="#1E293B" stroke="#334155" stroke-opacity="0.4"/>
  <text x="614" y="376" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">#ORD-9418</text>
  <text x="614" y="392" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Express Delivery</text>
  <rect x="710" y="368" width="48" height="16" rx="4" fill="#6366F1" fill-opacity="0.2"/>
  <text x="717" y="380" fill="#818CF8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Packed</text>

  <!-- Bottom Inventory Table Mini -->
  <rect x="204" y="348" width="374" height="110" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-opacity="0.6"/>
  <text x="220" y="370" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Inventory Stock Status (Real-time Firebase Sync)</text>
  <line x1="220" y1="382" x2="560" y2="382" stroke="#334155" stroke-opacity="0.5"/>
  
  <text x="220" y="402" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Product SKU-821 (Apparel Set)</text>
  <text x="440" y="402" fill="#10B981" font-family="system-ui, sans-serif" font-size="11">86 in Stock</text>
  <rect x="520" y="392" width="38" height="14" rx="3" fill="#10B981" fill-opacity="0.2"/>
  <text x="526" y="402" fill="#34D399" font-family="system-ui, sans-serif" font-size="9">Good</text>

  <text x="220" y="426" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Product SKU-402 (Accessory Kit)</text>
  <text x="440" y="426" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11">12 in Stock</text>
  <rect x="520" y="416" width="38" height="14" rx="3" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="527" y="426" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9">Low</text>

  <text x="220" y="450" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Product SKU-109 (Essential Bundle)</text>
  <text x="440" y="450" fill="#10B981" font-family="system-ui, sans-serif" font-size="11">240 in Stock</text>
  <rect x="520" y="440" width="38" height="14" rx="3" fill="#10B981" fill-opacity="0.2"/>
  <text x="526" y="450" fill="#34D399" font-family="system-ui, sans-serif" font-size="9">Good</text>
</svg>
