  <rect x="204" y="156" width="374" height="180" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-opacity="0.6"/>
  <text x="220" y="180" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Order Volume Analytics</text>
  <text x="220" y="196" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Real-time order fulfillment trend</text>
  
  <!-- Wave Graph -->
  <path d="M 224 290 Q 270 240 310 260 T 400 210 T 470 230 T 550 190 L 550 310 L 224 310 Z" fill="url(#chartGrad)"/>
  <path d="M 224 290 Q 270 240 310 260 T 400 210 T 470 230 T 550 190" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
  <circle cx="470" cy="230" r="4" fill="#38BDF8" stroke="#0B1120" stroke-width="2"/>
  <circle cx="550" cy="190" r="4" fill="#6366F1" stroke="#0B1120" stroke-width="2"/>

