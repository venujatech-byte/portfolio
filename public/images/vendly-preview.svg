  <rect x="16" y="420" width="148" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-opacity="0.5"/>
  <circle cx="36" cy="441" r="12" fill="#6366F1"/>
  <text x="32" y="445" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">VS</text>
  <text x="56" y="437" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Team Leader</text>
  <text x="56" y="449" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10">Active Admin</text>

